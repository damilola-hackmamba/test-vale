name: review-gravv-docs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  vale:
    name: runner / vale
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vale
        run: |
          wget -q https://github.com/errata-ai/vale/releases/download/v3.7.1/vale_3.7.1_Linux_64-bit.tar.gz
          tar -xzf vale_3.7.1_Linux_64-bit.tar.gz vale
          sudo mv vale /usr/local/bin/vale

      - name: Download Vale styles
        run: vale sync

      - name: Copy custom styles and vocabularies
        run: cp -r .github/custom-styles/. .github/styles/

      - name: Lint documentation
        run: vale ./docs

      - name: Delete Vale styles
        if: always()
        run: rm -rf .github/styles
