extends: conditional
message: "Define '%s' on first use. Write the full term followed by the abbreviation in parentheses, for example: 'Application Programming Interface (API)'. Use the abbreviation in all subsequent mentions."
link: 'https://developers.google.com/style/abbreviations'
level: warning
scope: paragraph
ignorecase: false
# Ensures that if an abbreviation appears, its full definition with
# the abbreviation in parentheses also appears in the document.
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
exceptions:
  # Inherited from Google Acronyms — universally understood
  - API
  - ASP
  - CLI
  - CPU
  - CSS
  - CSV
  - DEBUG
  - DOM
  - DPI
  - FAQ
  - GCC
  - GDB
  - GET
  - GPU
  - GTK
  - GUI
  - HTML
  - HTTP
  - HTTPS
  - IDE
  - JAR
  - JSON
  - JSX
  - LESS
  - LLDB
  - NET
  - NOTE
  - NVDA
  - OSS
  - PATH
  - PDF
  - PHP
  - POST
  - RAM
  - REPL
  - RSA
  - SCM
  - SCSS
  - SDK
  - SQL
  - SSH
  - SSL
  - SVG
  - TBD
  - TCP
  - TODO
  - URI
  - URL
  - USB
  - UTF
  - XML
  - XSS
  - YAML
  - ZIP
  # Gravv-specific — add abbreviations that don't need defining here
  - KYC
  - FX